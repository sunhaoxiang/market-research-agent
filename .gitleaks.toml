# gitleaks 配置（DEVELOPMENT_PLAN.md §17.1-3）
# 目标：任何 secret 都不得进入 git 历史。

[extend]
useDefault = true

[[rules]]
id = "llm-provider-key"
description = "LLM provider API key"
# OpenAI(sk-)/Anthropic(sk-ant-)/Google(AIza)/Moonshot(sk-)/DeepSeek(sk-)/Zhipu(.<32hex>)
regex = '''(?i)(sk-ant-[a-z0-9_\-]{20,}|sk-[a-z0-9]{32,}|AIza[0-9A-Za-z\-_]{35})'''
tags = ["key", "llm"]

[[rules]]
id = "data-provider-key"
description = "数据源 API key（Tavily / FMP / CoinGecko）"
regex = '''(?i)(tvly-[a-z0-9\-]{20,}|CG-[a-zA-Z0-9]{20,})'''
tags = ["key", "data"]

[[rules]]
id = "assigned-secret-env"
description = "环境变量形式的明文 secret"
regex = '''(?i)^\s*(OPENAI|ANTHROPIC|GOOGLE|MOONSHOT|DEEPSEEK|ZHIPU|TAVILY|FMP|COINGECKO)_API_KEY\s*=\s*["']?[^\s"'#]{12,}'''
path = '''\.env'''
tags = ["key", "env"]

[allowlist]
description = "允许的占位与文档内容"
paths = [
  '''\.env\.example$''',
  '''pnpm-lock\.yaml$''',
  '''uv\.lock$''',
  '''docs/.*\.md$''',
  '''\.gitleaks\.toml$''',
]
regexes = [
  '''sk-test-should-not-appear''', # 单元测试中的假 key
  '''your@email\.com''',
  '''contact@example\.com''',
]
