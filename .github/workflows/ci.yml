name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (agent service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/agent/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github . ../../evals

      - name: Ruff format
        run: uv run ruff format --check . ../../evals

      - name: Type check
        run: uv run basedpyright

      - name: Tests
        run: uv run pytest -m "not live" --cov=agent_service --cov-report=term-missing

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/agent/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pydantic 是跨语言类型的唯一真源，此处确保生成的 TS 类型没有漂移（§5.1）
      - name: Check generated types are up to date
        run: |
          pnpm gen:types
          git diff --exit-code -- packages/shared/src/generated \
            || (echo "::error::生成的类型已过期，请在本地运行 pnpm gen:types 并提交" && exit 1)

      - name: ESLint
        run: pnpm -r lint

      - name: Prettier
        run: pnpm exec prettier --check .

      # -r 而非 --filter：确保 @mra/shared 的类型断言测试也在 CI 里跑，
      # 它是判别联合没有退化成 unknown 的唯一防线
      - name: Type check
        run: pnpm -r typecheck

      - name: Drizzle migration check
        run: pnpm --filter @mra/web db:check

      - name: Tests
        run: pnpm -r test

      - name: Build
        run: pnpm --filter @mra/web build
        env:
          DATABASE_URL: file:./data/ci.db
          AGENT_SERVICE_URL: http://127.0.0.1:8000

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Install Playwright Chromium
        run: pnpm --filter @mra/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm --filter @mra/web build
        env:
          DATABASE_URL: file:./data/e2e.db
          AGENT_SERVICE_URL: http://127.0.0.1:18000

      - name: Playwright
        run: pnpm --filter @mra/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 不用 gitleaks-action：它按 push 的 commit 范围构造 --log-opts，git 往
      # stderr 写任何东西（哪怕只是提示）都会被当成扫描失败。同一份配置在
      # P1-9 的运行里挂了、P1-10 又过了——会随机误报的安全门等于没有门。
      # 直接跑二进制、每次全量扫，结果是确定的
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # 扫全量 git 历史而非工作区：secret 一旦提交过，即使后续删掉也仍留在
      # commit 对象里，只扫工作区会漏。--redact 保证真命中时 CI 日志里
      # 不会再印一遍明文（日志本身可能是公开的）
      - name: Scan git history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
